<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A personal Bumbershoot 2026 schedule planner. Picks are saved on your device — no account, no backend.">
<meta name="theme-color" content="#12141B">
<title>Bumbershoot 2026 — My Schedule</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2312141B'/><path d='M16 7l8 7H8z' fill='%23FF6B4A'/><rect x='15' y='14' width='2' height='10' rx='1' fill='%2355C7DB'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <div class="title-row">
    <h1>My Bumbershoot</h1>
    <button type="button" class="who" id="who" aria-haspopup="dialog">
      <span class="who-name" id="who-name">Me</span><span class="who-caret">▾</span>
    </button>
  </div>
  <div class="days" role="tablist" aria-label="Festival day">
    <button class="day-btn active" role="tab" aria-selected="true" data-day="Sat">Saturday, Sep 5<span class="today-pip" hidden></span></button>
    <button class="day-btn" role="tab" aria-selected="false" data-day="Sun">Sunday, Sep 6<span class="today-pip" hidden></span></button>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input type="search" id="search" placeholder="Search artists & stages" autocomplete="off" aria-label="Search artists and stages">
    <button type="button" class="search-clear" id="search-clear" hidden aria-label="Clear search">×</button>
  </div>
  <button type="button" class="filters-btn" id="filters-btn" aria-expanded="false" aria-controls="filter-panel">
    Filters<span class="filters-count" id="filters-count" hidden></span>
  </button>
</div>

<!-- The legend does the filtering: each swatch is a toggle. -->
<div class="legend" role="group" aria-label="Filter by your picks">
  <button type="button" class="lg-btn" data-pick="have"><span class="dot have"></span>Have to see</button>
  <button type="button" class="lg-btn" data-pick="want"><span class="dot want"></span>Want to see</button>
  <button type="button" class="lg-btn" data-pick="conflict"><span class="dot conflict"></span>Conflicts</button>
  <button type="button" class="lg-btn" data-pick="free" title="Sets that clash with nothing you've picked">Free time</button>
  <span class="counts" id="counts"></span>
</div>

<div class="filter-panel" id="filter-panel" hidden>
  <div class="filter-row">
    <span class="filter-label">Kind</span>
    <div class="cats" role="group" aria-label="Filter by category">
      <button type="button" class="cat-btn active" data-cat="All">All</button>
      <button type="button" class="cat-btn" data-cat="Music">Music</button>
      <button type="button" class="cat-btn" data-cat="Arts">Arts</button>
    </div>
  </div>
  <div class="filter-row" id="rec-filters" hidden>
    <span class="filter-label">The Stranger</span>
    <div class="cats" role="group" aria-label="Filter by The Stranger's picks">
      <button type="button" class="rec-btn active" data-rec="all">All</button>
      <button type="button" class="rec-btn" data-rec="star">★ Picks</button>
      <button type="button" class="rec-btn" data-rec="local">Local</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Where</span>
    <select id="stage-filter" class="stage-filter" aria-label="Filter by stage"></select>
  </div>
  <button type="button" class="filter-reset" id="filter-reset">Reset all filters</button>
</div>

<div class="banner" id="import-banner" hidden></div>

<main id="board">
  <section class="day-col active" data-day="Sat" aria-label="Saturday, Sep 5">
    <div class="col-head">Saturday, Sep 5</div>
    <div class="upnext" id="upnext-Sat" hidden></div>
    <div class="col-list" id="list-Sat"></div>
  </section>
  <section class="day-col" data-day="Sun" aria-label="Sunday, Sep 6">
    <div class="col-head">Sunday, Sep 6</div>
    <div class="upnext" id="upnext-Sun" hidden></div>
    <div class="col-list" id="list-Sun"></div>
  </section>
</main>

<button type="button" class="jump-now" id="jump-now"><span class="dot"></span>Jump to now</button>

<footer>
  Doors 12:30 PM · tap a row to cycle: none → have → want → none
</footer>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

<script src="js/data.js"></script>
<script src="js/schedule.js"></script>
<script src="js/share.js"></script>
<script src="js/recs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
